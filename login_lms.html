<html lang="id">
<head>
  <title>Login Prasetiya Mulya</title>
  <style>
    body {
      background: url('bg_login_mdl.jpg') no-repeat center center / cover fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .login-card {
      background-color: white;
      width: 100%;
      max-width: 750px;          
      border-radius: 12px;        
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); 
      padding: 40px;
      display: flex;            
      gap: 40px;
      box-sizing: border-box;
    }

    .left-column {
      flex: 1;
    }

    .right-column {
      flex: 1;
      border-left: 1px solid #eee;
      padding-left: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .logo {
      width: 300px;          
      height: auto;
      margin-bottom: 25px;
      display: block;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 45px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      padding: 0 15px;
      font-size: 14px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .btn-login {
      width: 100%;
      height: 45px;
      background-color: #808080;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .lost-password {
      display: block;
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 12px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="login-card"> 
    <div class="left-column">
      <img src="logo_upm_biru.png" alt="Logo Universitas Prasetiya Mulya" class="logo">
      <form>
        <input type="text" placeholder="Username or email">
        <input type="password" placeholder="Password">
        <button type="button" class="btn-login">Log in</button>
        <a href="#" class="lost-password">Lost password?</a>
      </form>
    </div>

    <div class="right-column">
      <p>This site best viewed in Google Chrome.</p>
      <br>
      <p style="font-size: 12px; color: #888;">🔒 Cookies notice</p>
    </div>
  </div>

</body>
</html>
