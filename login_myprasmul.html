<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .login {
      width: 100%;
      max-width: 480px; /* Ukuran pas untuk layar desktop/laptop */
      margin: 50px auto;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: left;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: left;
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 16px;
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      height: 48px;
      border: 1px solid #aaa;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 15px;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #999;
      font-style: italic;
    }

    .forgot {
      color: #168bd3;
      font-size: 14px;
      font-weight: bold;
      font-style: italic;
      text-align: right;
      margin-top: 6px;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .captcha {
      display: flex;
      align-items: center;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .captcha input {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .captcha label {
      font-size: 15px;
      font-weight: normal;
      margin-left: 12px;
      margin-bottom: 0;
      cursor: pointer;
    }

    button {
      height: 50px;
      background-color: #07528d;
      color: white;
      border: none;
      border-radius: 25px; /* Dibuat melengkung oval seperti referensi */
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    button:hover {
      background-color: #053e6b;
    }

    .signup {
      text-align: center;
      font-size: 15px;
      color: #6b7280;
      margin-top: 20px;
    }

    .signup a {
      color: #182b61;
      font-weight: bold;
      text-decoration: underline;
    }

    .browser {
      text-align: left;
      color: #6b7280;
      font-size: 13px;
      margin-top: 30px;
      line-height: 1.4;
    }

    .browser b {
      color: black;
    }
  </style>
</head>

<body>
  <div class="login">
    <h1>Welcome</h1>
    <p class="subtitle">Please enter your login credentials</p>

    <form>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" />

      <label for="password" style="margin-top: 15px;">Password</label>
      <input type="password" id="password" placeholder="Enter your password"/>
      <a href="#" class="forgot">Forgot password?</a>

      <div class="captcha">
        <input type="checkbox" id="robot">
        <label for="robot">I'm not a robot</label>
      </div>
      
      <button type="submit">SIGN IN</button>
    </form>

    <p class="signup">Don't have an account? <a href="#">Sign up</a></p> 

    <p class="browser">
      Please use <b>Google Chrome</b> or <b>Mozilla Firefox</b> for best experience
    </p>
  </div>

</body>
</html>
